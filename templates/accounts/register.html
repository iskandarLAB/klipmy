{% extends 'base.html' %}

{% block title %}Daftar Akaun Baharu | KlipMY{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 border border-brand-200 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
      </div>
      <h1 class="text-2xl font-black text-slate-900">Daftar Akaun KlipMY</h1>
      <p class="text-xs text-slate-500 mt-1">Sertai pasaran video clipping no. 1 di Malaysia</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <!-- Pilihan Peranan / Role Selector -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">Saya mendaftar sebagai:</label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex flex-col p-3 rounded-xl border border-slate-200 hover:border-brand-500 cursor-pointer has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/50 transition-all text-center">
            <input type="radio" name="role" value="clipper" {% if role != 'brand' %}checked{% endif %} class="sr-only">
            <span class="text-xs font-black text-slate-900">🎬 Clipper</span>
            <span class="text-[10px] text-slate-500 mt-0.5">Potong video & dapat duit</span>
          </label>
          <label class="flex flex-col p-3 rounded-xl border border-slate-200 hover:border-brand-500 cursor-pointer has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50/50 transition-all text-center">
            <input type="radio" name="role" value="brand" {% if role == 'brand' %}checked{% endif %} class="sr-only">
            <span class="text-xs font-black text-slate-900">🏢 Brand</span>
            <span class="text-[10px] text-slate-500 mt-0.5">Lancar kempen & views</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nama Pengguna (Username) <span class="text-rose-500">*</span></label>
        <input type="text" name="username" required placeholder="Contoh: akramclipper" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Emel</label>
        <input type="email" name="email" placeholder="nama@email.com" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nombor Telefon (WhatsApp) <span class="text-rose-500">*</span></label>
        <input type="tel" name="phone" required placeholder="Contoh: 0123456789" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Handle TikTok</label>
          <input type="text" name="tiktok_handle" placeholder="@akaunanda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Handle IG Reels</label>
          <input type="text" name="instagram_handle" placeholder="@akaunanda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Kata Laluan <span class="text-rose-500">*</span></label>
        <input type="password" name="password" required placeholder="Minima 6 aksara" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm rounded-xl shadow-md shadow-brand-600/30 transition-all">
        Cipta Akaun & Mula &rarr;
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      Sudah ada akaun?
      <a href="{% url 'accounts:login' %}" class="font-bold text-brand-600 hover:underline">Log Masuk</a>
    </div>
  </div>

</div>
{% endblock %}
