{% extends 'base.html' %}

{% block title %}Log Masuk | KlipMY{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-10">

  <div class="bg-white border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-brand-50 text-brand-600 border border-brand-200 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
      </div>
      <h1 class="text-2xl font-black text-slate-900">Selamat Kembali</h1>
      <p class="text-xs text-slate-500 mt-1">Log masuk ke akaun Clipper atau Brand anda</p>
    </div>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nama Pengguna (Username)</label>
        <input type="text" name="username" required autofocus placeholder="Masukkan username anda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-700">Kata Laluan</label>
        </div>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs sm:text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none" />
      </div>

      <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-sm rounded-xl shadow-md shadow-brand-600/30 transition-all">
        Log Masuk &rarr;
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      Belum mempunyai akaun?
      <a href="{% url 'accounts:register' %}" class="font-bold text-brand-600 hover:underline">Daftar Percuma</a>
    </div>
  </div>

</div>
{% endblock %}
